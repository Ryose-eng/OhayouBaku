services:
  - type: web
    name: backend
    env: docker
    rootDirectory: .
    dockerfilePath: ./docker/php/Dockerfile.prod
    buildCommand: |
      composer install --no-dev --working-dir=backend && \
      cd backend && \
      php artisan key:generate && \
      php artisan migrate
    startCommand: cd backend && php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: ohayoubaku-db
          property: host
      - key: DB_DATABASE
        fromDatabase:
          name: ohayoubaku-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ohayoubaku-db
          property: username
      - key: DB_PASSWORD
        fromDatabase:
          name: ohayoubaku-db
          property: password
      - key: FRONTEND_URL
        value: https://ohayoubaku-frontend.onrender.com

  - type: web
    name: frontend
    env: node
    rootDirectory: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run preview -- --host 0.0.0.0 --port $PORT
    envVars:
      - key: VITE_API_URL
        value: https://ohayoubaku-backend.onrender.com

databases:
  - name: ohayoubaku-db
    plan: free
    ipAllowList: [] 