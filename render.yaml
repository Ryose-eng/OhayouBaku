services:
  - type: web
    name: ohayoubaku-backend
    env: docker
    dockerfilePath: ./docker/php/Dockerfile.prod
    buildDirectory: ./backend
    buildCommand: |
      composer install --no-dev && \
      php artisan key:generate && \
      php artisan migrate
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: ohayoubaku-db
          property: host
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        fromDatabase:
          name: ohayoubaku-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ohayoubaku-db
          property: username
      - key: DB_PASSWORD
        fromDatabase:
          name: ohayoubaku-db
          property: password

  - type: web
    name: ohayoubaku-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://ohayoubaku-backend.onrender.com

databases:
  - name: ohayoubaku-db
    plan: free
    ipAllowList: []