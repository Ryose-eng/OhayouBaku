services:
  # バックエンドAPI
  - type: web
    name: ohayoubaku-backend
    plan: free
    env: docker
    dockerfilePath: docker/php/Dockerfile.prod
    buildCommand: |
      cd backend && \
      composer install --no-dev --optimize-autoloader && \
      cp .env.example .env
    startCommand: |
      cd backend && \
      echo "=== データベース接続テスト ===" && \
      php artisan db:show && \
      echo "=== マイグレーション開始 ===" && \
      php artisan migrate:status && \
      php artisan config:cache && \
      echo "=== マイグレーション実行 ===" && \
      php artisan migrate --force || { echo "Migration failed"; exit 1; } && \
      echo "=== マイグレーション完了 ===" && \
      
    envVars:
      - key: APP_NAME
        value: OhayouBaku
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: true
      - key: LOG_LEVEL
        value: debug
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_URL
        value: https://ohayoubaku-backend-q8b6.onrender.com
      - key: FRONTEND_URL
        value: https://ohayoubaku-frontend-q8b6.onrender.com
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_DOMAIN
        value: .onrender.com
      - key: SANCTUM_STATEFUL_DOMAINS
        value: ohayoubaku-frontend-q8b6.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://ohayoubaku-frontend-q8b6.onrender.com

  # フロントエンド
  - type: web
    name: ohayoubaku-frontend
    plan: free
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && node server.js
    envVars:
      - key: VITE_API_URL
        value: https://ohayoubaku-backend-q8b6.onrender.com
      - key: VITE_WS_URL
        value: wss://ohayoubaku-frontend-q8b6.onrender.com
      - key: PORT
        value: "4173"

databases:
  - name: ohayoubaku-db
    databaseName: ohayoubaku_px40
    user: ohayoubaku
    plan: free
    ipAllowList: []