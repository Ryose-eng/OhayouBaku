services:
  - type: web
    name: backend
    env: docker
    dockerfilePath: docker/php/Dockerfile.prod
    buildCommand: |
      cd backend && \
      composer install --no-dev && \
      php artisan key:generate && \
      php artisan migrate
    startCommand: cd backend && php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: DB_HOST
        fromDatabase:
          name: mydb
          property: host
      - key: DB_DATABASE
        fromDatabase:
          name: mydb
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: mydb
          property: username
      - key: DB_PASSWORD
        fromDatabase:
          name: mydb
          property: password

  - type: web
    name: frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run preview
    envVars:
      - key: VITE_API_URL
        value: https://your-backend-domain.onrender.com

databases:
  - name: mydb
    ipAllowList: [] 