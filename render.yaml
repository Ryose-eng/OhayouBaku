services:
  # バックエンドAPI
  - type: web
    name: ohayoubaku-api
    env: docker
    dockerfilePath: ./docker/php/Dockerfile.prod
    buildCommand: |
      cp .env.example .env
      composer install --no-dev --optimize-autoloader
      php artisan key:generate
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: ohayoubaku-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ohayoubaku-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: ohayoubaku-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ohayoubaku-db
          property: username
      - key: DB_PASSWORD
        fromDatabase:
          name: ohayoubaku-db
          property: password

  # フロントエンド
  - type: web
    name: ohayoubaku-frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run preview
    envVars:
      - key: VITE_API_URL
        value: https://ohayoubaku-api.onrender.com

databases:
  - name: ohayoubaku-db
    databaseName: ohayoubaku
    user: ohayoubaku
    plan: free 