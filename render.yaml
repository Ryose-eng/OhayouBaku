services:
  # バックエンドAPI
  - type: web
    name: ohayoubaku-backend
    plan: free
    env: docker
    dockerfilePath: docker/php/Dockerfile.prod
    buildCommand: |
      cd backend && \
      cp .env.example .env && \
      php artisan key:generate --force
    startCommand: |
      cd backend && \
      php artisan migrate --force && \
      php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_NAME
        value: OhayouBaku
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://ohayoubaku-backend-q8b6.onrender.com
      - key: FRONTEND_URL
        value: https://ohayoubaku-frontend-q8b6.onrender.com
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: ohayoubaku-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ohayoubaku-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: ohayoubaku-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ohayoubaku-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ohayoubaku-db
          property: password
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_DOMAIN
        value: .onrender.com
      - key: SANCTUM_STATEFUL_DOMAINS
        value: ohayoubaku-frontend-q8b6.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://ohayoubaku-frontend-q8b6.onrender.com
      - key: INTERNAL_DATABASE_URL
        fromDatabase:
          name: ohayoubaku-db
          property: connectionString

  # フロントエンド
  - type: web
    name: ohayoubaku-frontend
    plan: free
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && node server.js
    envVars:
      - key: VITE_API_URL
        value: https://ohayoubaku-backend-q8b6.onrender.com
      - key: VITE_WS_URL
        value: wss://ohayoubaku-frontend-q8b6.onrender.com
      - key: PORT
        value: "4173"

databases:
  - name: ohayoubaku-db
    databaseName: ohayoubaku
    user: ohayoubaku
    plan: free
    ipAllowList: []